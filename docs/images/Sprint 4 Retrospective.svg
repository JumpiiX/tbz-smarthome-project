<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <!-- Background -->
  <rect width="1000" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Sprint 4 Retrospektive - Starfish Template
  </text>
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666">
    10.01.2026 - 28.01.2026 | Dokumentation &amp; Präsentation
  </text>
  
  <!-- Center circle -->
  <circle cx="500" cy="480" r="80" fill="#4A90E2" opacity="0.2"/>
  <text x="500" y="475" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Sprint 4</text>
  <text x="500" y="495" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Retrospektive</text>
  
  <!-- Keep (Top) - Green -->
  <path d="M 500 400 L 450 220 L 500 160 L 550 220 Z" fill="#4CAF50" opacity="0.15"/>
  <circle cx="500" cy="180" r="12" fill="#4CAF50"/>
  <text x="500" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#4CAF50">KEEP</text>
  
  <text x="500" y="250" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">• Sprint-Dokumentation</text>
  <text x="500" y="270" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">  während Arbeit</text>
  <text x="500" y="295" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">• Sales-Approach</text>
  <text x="500" y="315" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">  in Präsentation</text>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">• Live-Demos zeigen</text>
  
  <!-- More (Top Right) - Blue -->
  <path d="M 580 400 L 780 280 L 820 330 L 680 440 Z" fill="#2196F3" opacity="0.15"/>
  <circle cx="800" cy="305" r="12" fill="#2196F3"/>
  <text x="800" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2196F3">MORE</text>
  
  <text x="750" y="350" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Story statt</text>
  <text x="750" y="370" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  technische Details</text>
  <text x="750" y="395" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Visuelle Slides</text>
  <text x="750" y="415" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  statt Text</text>
  <text x="750" y="440" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Business-Impact zeigen</text>
  
  <!-- Less (Bottom Right) - Orange -->
  <path d="M 580 560 L 680 680 L 640 730 L 520 620 Z" fill="#FF9800" opacity="0.15"/>
  <circle cx="660" cy="705" r="12" fill="#FF9800"/>
  <text x="720" y="745" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FF9800">LESS</text>
  
  <text x="650" y="600" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Doku am Ende</text>
  <text x="650" y="620" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  schreiben (stressig)</text>
  <text x="650" y="645" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Perfektionismus</text>
  <text x="650" y="665" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  bei Slides</text>
  
  <!-- Stop (Bottom Left) - Red -->
  <path d="M 420 560 L 320 680 L 360 730 L 480 620 Z" fill="#F44336" opacity="0.15"/>
  <circle cx="340" cy="705" r="12" fill="#F44336"/>
  <text x="280" y="745" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#F44336">STOP</text>
  
  <text x="250" y="600" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Zu viel Code</text>
  <text x="250" y="620" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  in Präsentation</text>
  <text x="250" y="645" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Langweilige</text>
  <text x="250" y="665" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  Standard-Templates</text>
  
  <!-- Start (Top Left) - Purple -->
  <path d="M 420 400 L 220 280 L 180 330 L 320 440 Z" fill="#9C27B0" opacity="0.15"/>
  <circle cx="200" cy="305" r="12" fill="#9C27B0"/>
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#9C27B0">START</text>
  
  <text x="150" y="350" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Problem-Story</text>
  <text x="150" y="370" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  vor Lösung</text>
  <text x="150" y="395" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Echte Kunden</text>
  <text x="150" y="415" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  Impact zeigen</text>
  <text x="150" y="440" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Früher präsentieren</text>
  
  <!-- Stats Box -->
  <rect x="50" y="800" width="900" height="80" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="8"/>
  <text x="500" y="830" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Sprint 4 Highlights
  </text>
  <text x="500" y="855" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">
    34 Story Points | Doku 100% | Präsentation Ready | 100 Apartments Production | Von Lab zu Business
  </text>
  
  <!-- Legend -->
  <g transform="translate(50, 120)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">Starfish Template:</text>
    <circle cx="10" cy="20" r="5" fill="#4CAF50"/>
    <text x="25" y="25" font-family="Arial, sans-serif" font-size="11" fill="#666">Keep - Was gut lief</text>
    <circle cx="10" cy="40" r="5" fill="#2196F3"/>
    <text x="25" y="45" font-family="Arial, sans-serif" font-size="11" fill="#666">More - Mehr davon</text>
    <circle cx="10" cy="60" r="5" fill="#FF9800"/>
    <text x="25" y="65" font-family="Arial, sans-serif" font-size="11" fill="#666">Less - Weniger davon</text>
    <circle cx="10" cy="80" r="5" fill="#F44336"/>
    <text x="25" y="85" font-family="Arial, sans-serif" font-size="11" fill="#666">Stop - Aufhören</text>
    <circle cx="10" cy="100" r="5" fill="#9C27B0"/>
    <text x="25" y="105" font-family="Arial, sans-serif" font-size="11" fill="#666">Start - Neu beginnen</text>
  </g>
</svg>
