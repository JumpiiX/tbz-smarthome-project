<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Externe Umgebung (Orange) -->
  <ellipse cx="600" cy="450" rx="550" ry="400" fill="#FFF8DC" stroke="#CD853F" stroke-width="4"/>
  <text x="600" y="80" font-size="24" font-weight="bold" fill="#8B4513" text-anchor="middle">Externe Umgebung</text>
  
  <!-- Projektumgebung / Kubernetes Cluster (Blau) -->
  <ellipse cx="600" cy="480" rx="420" ry="300" fill="#E6F2FF" stroke="#4169E1" stroke-width="4"/>
  <text x="600" y="200" font-size="20" font-weight="bold" fill="#000080" text-anchor="middle">Projektumgebung / Kubernetes Cluster</text>
  
  <!-- Entwickler (links außen) -->
  <rect x="80" y="280" width="120" height="60" rx="10" fill="#F4A460" stroke="#8B4513" stroke-width="2"/>
  <text x="140" y="315" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Entwickler</text>
  
  <!-- GitHub (links außen) -->
  <rect x="80" y="380" width="120" height="60" rx="10" fill="#F4A460" stroke="#8B4513" stroke-width="2"/>
  <text x="140" y="415" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">GitHub</text>
  
  <!-- CI/CD Pipeline -->
  <ellipse cx="320" cy="380" rx="110" ry="50" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
  <text x="320" y="375" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">CI/CD Pipeline</text>
  <text x="320" y="395" font-size="12" fill="#FFF" text-anchor="middle">(GitHub Actions)</text>
  
  <!-- ArgoCD -->
  <ellipse cx="480" cy="320" rx="90" ry="45" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
  <text x="480" y="325" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">ArgoCD</text>
  <text x="480" y="340" font-size="12" fill="#000" text-anchor="middle">GitOps</text>
  
  <!-- Sealed Secrets -->
  <ellipse cx="680" cy="320" rx="100" ry="45" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
  <text x="680" y="320" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Sealed Secrets</text>
  <text x="680" y="335" font-size="12" fill="#000" text-anchor="middle">Controller</text>
  
  <!-- Rust Container -->
  <ellipse cx="480" cy="480" rx="110" ry="50" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
  <text x="480" y="475" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Rust Container</text>
  <text x="480" y="495" font-size="12" fill="#000" text-anchor="middle">SmartHome Bridge</text>
  
  <!-- K8s Secrets -->
  <ellipse cx="680" cy="480" rx="90" ry="45" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
  <text x="680" y="480" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">K8s Secrets</text>
  <text x="680" y="495" font-size="12" fill="#000" text-anchor="middle">Decrypted</text>
  
  <!-- Endbenutzer -->
  <rect x="1000" y="420" width="140" height="70" rx="10" fill="#F4A460" stroke="#8B4513" stroke-width="2"/>
  <text x="1070" y="450" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Endbenutzer</text>
  <text x="1070" y="472" font-size="11" fill="#000" text-anchor="middle">(Apple Devices)</text>
  
  <!-- KNX Website (unten außen) -->
  <rect x="460" y="750" width="140" height="60" rx="10" fill="#F4A460" stroke="#8B4513" stroke-width="2"/>
  <text x="530" y="785" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">KNX Website</text>
  
  <!-- Pfeile und Labels -->
  
  <!-- ES01: git push -->
  <line x1="140" y1="340" x2="140" y2="380" stroke="#000" stroke-width="3" marker-end="url(#arrowblack)"/>
  <text x="70" y="365" font-size="11" font-weight="bold" fill="#000">ES01</text>
  <text x="160" y="365" font-size="10" fill="#555">git push</text>
  
  <!-- ES02: webhook -->
  <line x1="200" y1="410" x2="260" y2="390" stroke="#000" stroke-width="3" marker-end="url(#arrowblack)"/>
  <text x="210" y="395" font-size="11" font-weight="bold" fill="#000">ES02</text>
  <text x="210" y="408" font-size="10" fill="#555">webhook</text>
  
  <!-- IS01: helm deploy -->
  <line x1="380" y1="360" x2="430" y2="340" stroke="#000" stroke-width="3" marker-end="url(#arrowblack)"/>
  <text x="390" y="345" font-size="11" font-weight="bold" fill="#000">IS01</text>
  <text x="390" y="358" font-size="10" fill="#555">helm deploy</text>
  
  <!-- IS02: sync -->
  <line x1="480" y1="365" x2="480" y2="430" stroke="#000" stroke-width="3" marker-end="url(#arrowblack)"/>
  <text x="495" y="400" font-size="11" font-weight="bold" fill="#000">IS02</text>
  <text x="495" y="413" font-size="10" fill="#555">sync</text>
  
  <!-- IS03: decrypt -->
  <line x1="680" y1="365" x2="680" y2="430" stroke="#000" stroke-width="3" marker-end="url(#arrowblack)"/>
  <text x="695" y="400" font-size="11" font-weight="bold" fill="#000">IS03</text>
  <text x="695" y="413" font-size="10" fill="#555">decrypt</text>
  
  <!-- IS04: read secrets -->
  <line x1="590" y1="480" x2="620" y2="480" stroke="#000" stroke-width="3" marker-end="url(#arrowblack)"/>
  <text x="605" y="470" font-size="11" font-weight="bold" fill="#000">IS04</text>
  <text x="605" y="500" font-size="10" fill="#555">read</text>
  
  <!-- IS05: scrape -->
  <path d="M 480 530 Q 480 640 530 700" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowblack)"/>
  <text x="450" y="640" font-size="11" font-weight="bold" fill="#000">IS05</text>
  <text x="450" y="653" font-size="10" fill="#555">scrape</text>
  
  <!-- ES03: HomeKit - Pfeil geht über K8s Secrets drüber -->
  <path d="M 480 450 Q 480 380 750 380 Q 950 380 1000 440" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowblack)"/>
  <text x="700" y="365" font-size="11" font-weight="bold" fill="#000">ES03</text>
  <text x="700" y="378" font-size="10" fill="#555">HomeKit Protocol</text>
  
  <!-- Rückkopplung (gestrichelt) -->
  <path d="M 530 750 Q 200 700 200 440" stroke="#000" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowdashed)"/>
  
  <!-- Legende -->
  <rect x="60" y="610" width="260" height="100" rx="5" fill="#FFF" stroke="#000" stroke-width="2"/>
  <text x="190" y="630" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Legende:</text>
  
  <line x1="80" y1="650" x2="120" y2="650" stroke="#000" stroke-width="3" marker-end="url(#arrowblack)"/>
  <text x="130" y="655" font-size="12" fill="#000">Externe Schnittstelle (ES)</text>
  
  <line x1="80" y1="670" x2="120" y2="670" stroke="#000" stroke-width="3" marker-end="url(#arrowblack)"/>
  <text x="130" y="675" font-size="12" fill="#000">Interne Schnittstelle (IS)</text>
  
  <line x1="80" y1="690" x2="120" y2="690" stroke="#000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowdashed)"/>
  <text x="130" y="695" font-size="12" fill="#000">Rückkopplung</text>
  
  <!-- Info Box -->
  <rect x="380" y="730" width="380" height="110" rx="5" fill="#90EE90" stroke="#228B22" stroke-width="2"/>
  <text x="570" y="755" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">Multi-Tenant Kubernetes Deployment</text>
  <text x="390" y="778" font-size="13" fill="#000">1. ArgoCD synchronisiert Helm Charts aus Git</text>
  <text x="390" y="797" font-size="13" fill="#000">2. Sealed Secrets werden zu K8s Secrets</text>
  <text x="390" y="816" font-size="13" fill="#000">3. Rust Container startet pro Apartment (Namespace)</text>
  <text x="390" y="835" font-size="13" fill="#000">4. HomeKit Bridge registriert sich bei Apple Devices</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowblack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
    <marker id="arrowdashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
</svg>