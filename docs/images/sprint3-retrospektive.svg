  <circle cx="800" cy="305" r="12" fill="#2196F3"/>
  <text x="800" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2196F3">MORE</text>
  
  <text x="750" y="350" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Automatisierte Tests</text>
  <text x="750" y="370" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  in Pipeline</text>
  <text x="750" y="395" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Monitoring Alerts</text>
  <text x="750" y="415" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  nutzen</text>
  <text x="750" y="440" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Backup-Tests</text>
  
