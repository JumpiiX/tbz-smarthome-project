  <text x="650" y="645" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Performance Test</text>
  <text x="650" y="665" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  Tuning Zeit</text>
  
