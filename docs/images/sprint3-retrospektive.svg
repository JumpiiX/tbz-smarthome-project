  <text x="250" y="645" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• IP:Port URLs</text>
  <text x="250" y="665" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  verwenden</text>
  
  <!-- Start (Top Left) - Purple -->
