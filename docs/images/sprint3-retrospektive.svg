  <circle cx="500" cy="180" r="12" fill="#4CAF50"/>
  <text x="500" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#4CAF50">KEEP</text>
  
  <text x="500" y="250" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">• ArgoCD Auto-Sync perfekt</text>
  <text x="500" y="270" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">• CI/CD Pipeline spart Zeit</text>
