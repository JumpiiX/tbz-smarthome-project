  <text x="150" y="350" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Weekly Backup</text>
  <text x="150" y="370" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  Restore Tests</text>
  <text x="150" y="395" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Security Scans</text>
  <text x="150" y="415" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">  in Pipeline</text>
  <text x="150" y="440" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">• Load Tests vor Deploy</text>
  
