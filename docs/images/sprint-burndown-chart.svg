<svg width="900" height="800" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <rect width="900" height="800" fill="url(#bgGradient)"/>
  
  <!-- Title Section -->
  <rect x="50" y="20" width="800" height="80" fill="#ffffff" rx="10" stroke="#e9ecef" stroke-width="1" filter="url(#shadow)"/>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Sprint Burndown Chart</text>
  <text x="450" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6c757d">TBZ SmartHome Project | 4 Sprints | 167 Story Points | 27.10.2025 - 28.01.2026</text>
  
  <!-- Chart Container -->
  <rect x="70" y="120" width="760" height="520" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Chart area -->
  <g transform="translate(120, 150)">
    <!-- Grid lines (horizontal) with better spacing -->
    <line x1="0" y1="0" x2="660" y2="0" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="0" y1="75" x2="660" y2="75" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="0" y1="150" x2="660" y2="150" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="0" y1="225" x2="660" y2="225" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="0" y1="300" x2="660" y2="300" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="0" y1="375" x2="660" y2="375" stroke="#f1f3f4" stroke-width="1"/>
    
    <!-- Grid lines (vertical) -->
    <line x1="0" y1="0" x2="0" y2="375" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="165" y1="0" x2="165" y2="375" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="330" y1="0" x2="330" y2="375" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="495" y1="0" x2="495" y2="375" stroke="#f1f3f4" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="375" stroke="#f1f3f4" stroke-width="1"/>
    
    <!-- Sprint divider lines -->
    <line x1="165" y1="0" x2="165" y2="375" stroke="#adb5bd" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="330" y1="0" x2="330" y2="375" stroke="#adb5bd" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="495" y1="0" x2="495" y2="375" stroke="#adb5bd" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Y-axis labels (Story Points) -->
    <text x="-20" y="5" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">167</text>
    <text x="-20" y="80" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">133</text>
    <text x="-20" y="155" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">100</text>
    <text x="-20" y="230" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">67</text>
    <text x="-20" y="305" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">33</text>
    <text x="-20" y="380" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">0</text>
    
    <!-- Sprint Labels at top -->
    <text x="82" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#343a40">Sprint 1</text>
    <text x="247" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#343a40">Sprint 2</text>
    <text x="412" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#343a40">Sprint 3</text>
    <text x="577" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#343a40">Sprint 4</text>
    
    <!-- Sprint dates at top -->
    <text x="82" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">27.10-17.11</text>
    <text x="247" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">18.11-15.12</text>
    <text x="412" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">16.12-10.01</text>
    <text x="577" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">11.01-28.01</text>
    
    
    <!-- Ideal burndown line (red dashed) -->
    <line x1="0" y1="0" x2="660" y2="375" stroke="#dc3545" stroke-width="3" stroke-dasharray="8,4"/>
    
    <!-- Actual burndown line (blue solid) -->
    <polyline points="0,0 165,109 330,209 495,335 660,375" fill="none" stroke="#0d6efd" stroke-width="4"/>
    
    <!-- Data points with larger circles -->
    <circle cx="0" cy="0" r="6" fill="#dc3545" stroke="#ffffff" stroke-width="2"/>
    <circle cx="165" cy="109" r="6" fill="#0d6efd" stroke="#ffffff" stroke-width="2"/>
    <circle cx="330" cy="209" r="6" fill="#0d6efd" stroke="#ffffff" stroke-width="2"/>
    <circle cx="495" cy="335" r="6" fill="#0d6efd" stroke="#ffffff" stroke-width="2"/>
    <circle cx="660" cy="375" r="6" fill="#198754" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Story Points completed labels with background -->
    <rect x="150" y="90" width="30" height="18" fill="#ffffff" rx="4" stroke="#0d6efd" stroke-width="1"/>
    <text x="165" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d6efd">49 SP</text>
    
    <rect x="315" y="190" width="30" height="18" fill="#ffffff" rx="4" stroke="#0d6efd" stroke-width="1"/>
    <text x="330" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d6efd">55 SP</text>
    
    <rect x="480" y="316" width="30" height="18" fill="#ffffff" rx="4" stroke="#0d6efd" stroke-width="1"/>
    <text x="495" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d6efd">30 SP</text>
    
    <rect x="645" y="356" width="30" height="18" fill="#ffffff" rx="4" stroke="#198754" stroke-width="1"/>
    <text x="660" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#198754">34 SP</text>
    
    <!-- Remaining points labels -->
    <rect x="60" y="115" width="44" height="25" fill="#fff3cd" rx="4" stroke="#ffc107" stroke-width="1"/>
    <text x="82" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#856404">118</text>
    <text x="82" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#856404">remaining</text>
    
    <rect x="225" y="215" width="44" height="25" fill="#fff3cd" rx="4" stroke="#ffc107" stroke-width="1"/>
    <text x="247" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#856404">63</text>
    <text x="247" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#856404">remaining</text>
    
    <rect x="390" y="341" width="44" height="25" fill="#fff3cd" rx="4" stroke="#ffc107" stroke-width="1"/>
    <text x="412" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#856404">33</text>
    <text x="412" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#856404">remaining</text>
    
    <rect x="610" y="330" width="44" height="25" fill="#d1e7dd" rx="4" stroke="#198754" stroke-width="1"/>
    <text x="632" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0f5132">0</text>
    <text x="632" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0f5132">remaining</text>
  </g>
  
  <!-- Axis labels -->
  <text x="35" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" transform="rotate(-90, 35, 350)">Story Points Remaining</text>
  
  <!-- Sprint Summary -->
  <rect x="70" y="680" width="480" height="140" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)"/>
  <text x="310" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#343a40">Sprint Summary</text>
  
  <text x="90" y="730" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <tspan fill="#0d6efd" font-weight="bold">Sprint 1:</tspan> Foundation &amp; Manual Deployment (49 SP)
  </text>
  <text x="90" y="750" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <tspan fill="#0d6efd" font-weight="bold">Sprint 2:</tspan> Kubernetes &amp; Multi-Tenant Infrastructure (55 SP)
  </text>
  <text x="90" y="770" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <tspan fill="#fd7e14" font-weight="bold">Sprint 3:</tspan> Production Ready System (30/46 SP delivered)
  </text>
  <text x="90" y="790" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <tspan fill="#198754" font-weight="bold">Sprint 4:</tspan> Documentation &amp; Presentation (34 SP)
  </text>
  <text x="90" y="810" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <tspan fill="#198754" font-weight="bold">Result:</tspan> 98 Active Apartments | Production Ready System
  </text>

  <!-- Legend with better layout -->
  <rect x="570" y="680" width="260" height="120" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)"/>
  <text x="700" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#343a40">Legend</text>
  
  <!-- Legend items -->
  <line x1="590" y1="725" x2="620" y2="725" stroke="#dc3545" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="630" y="730" font-family="Arial, sans-serif" font-size="12" fill="#495057">Ideal Burndown</text>
  
  <line x1="590" y1="745" x2="620" y2="745" stroke="#0d6efd" stroke-width="3"/>
  <text x="630" y="750" font-family="Arial, sans-serif" font-size="12" fill="#495057">Actual Burndown</text>
  
  <circle cx="605" cy="765" r="5" fill="#198754" stroke="#ffffff" stroke-width="2"/>
  <text x="630" y="770" font-family="Arial, sans-serif" font-size="12" fill="#495057">Project Complete</text>
</svg>